name: Windows install check

# Installs a *published* release on clean Windows runners exactly as the
# README tells users to (install.ps1 from the repository, assets from GitHub
# Releases, signature and checksum verified), then starts the installed
# executable. It also checks the portable ZIP path. Runs after every release
# (called from release.yml) and on demand for any published version.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v (empty = latest)"
        required: false
        default: ""
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  install:
    name: install (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install with install.ps1 (Windows PowerShell 5.1)
        shell: powershell
        env:
          TUISENSE_INSTALL_DIR: ${{ runner.temp }}\Tüisense Test Dir\bin
        run: |
          $installArgs = @{ NoModifyPath = $true }
          if ('${{ inputs.version }}') { $installArgs.Version = '${{ inputs.version }}' }
          & .\scripts\install.ps1 @installArgs
      - name: README one-liner from Command Prompt (cmd.exe)
        shell: cmd
        env:
          TUISENSE_INSTALL_DIR: ${{ runner.temp }}\cmd-install\bin
        run: |
          powershell -NoProfile -Command "irm https://raw.githubusercontent.com/Phobby/TuiSense/main/scripts/install.ps1 | iex"
          if errorlevel 1 exit /b 1
          "%RUNNER_TEMP%\cmd-install\bin\tuisense.exe" --version || exit /b 1
      - name: Start the installed executable
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'Tüisense Test Dir\bin\tuisense.exe'
          $v = & $exe --version
          Write-Output $v
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'windows/arm64' } else { 'windows/amd64' }
          if ($v -notmatch [regex]::Escape($arch)) { throw "wrong architecture installed: $v" }
          & $exe --help | Out-Null
          & $exe doctor --windows
          if ($LASTEXITCODE -ne 0) { throw 'doctor failed' }
      - name: Portable ZIP (no installer, no Go)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ('${{ inputs.version }}') { 'v${{ inputs.version }}' } else { (gh release view -R $env:GITHUB_REPOSITORY --json tagName -q .tagName) }
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } else { 'amd64' }
          $dir = Join-Path $env:RUNNER_TEMP 'portable'
          gh release download $tag -R $env:GITHUB_REPOSITORY -p "*_windows_$arch.zip" -p SHA256SUMS -D $dir
          $zip = Get-ChildItem $dir -Filter *.zip | Select-Object -First 1
          $want = (Select-String -Path (Join-Path $dir SHA256SUMS) -Pattern ([regex]::Escape($zip.Name))).Line.Split(' ')[0]
          if ((Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower() -ne $want) { throw 'checksum mismatch' }
          Expand-Archive $zip.FullName -DestinationPath $dir
          $exe = Get-ChildItem $dir -Recurse -Filter tuisense.exe | Select-Object -First 1
          & $exe.FullName --version
          if ($LASTEXITCODE -ne 0) { throw 'portable executable did not start' }
