name: Release

# Publishes a release when a version tag (v0.8.0, v0.9.0-rc.1) is pushed.
# Every archive is built and smoke-tested on a native runner, the checksum
# list is signed with the release key (OpenSSH SSHSIG, namespace
# "tuisense-release") and verified against the key pinned in the repository
# before anything is published. Without the signing secret the release fails.
# Run it by hand (workflow_dispatch) for a dry run: everything is built,
# packaged and tested from VERSION, nothing is signed or published.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Tag matches VERSION
        if: github.ref_type == 'tag'
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME%%-*}" || test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - run: go vet ./...
      - run: go test -count=1 ./...

  build:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: ubuntu-latest,     goos: linux,   goarch: amd64 }
          - { runner: ubuntu-24.04-arm,  goos: linux,   goarch: arm64 }
          - { runner: macos-15-intel,    goos: darwin,  goarch: amd64 }
          - { runner: macos-15,          goos: darwin,  goarch: arm64 }
          - { runner: windows-latest,    goos: windows, goarch: amd64 }
          - { runner: windows-11-arm,    goos: windows, goarch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="$(cat VERSION)"; fi
          EXT=""; [ "$GOOS" = windows ] && EXT=".exe"
          go build -trimpath -ldflags "-s -w -X github.com/Phobby/TuiSense/internal/version.Version=${VERSION} -X github.com/Phobby/TuiSense/internal/version.Commit=${GITHUB_SHA}" -o "build/tuisense${EXT}" ./cmd/tuisense
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BIN=build/tuisense${EXT}" >> "$GITHUB_ENV"
      - name: Smoke test on the native runner
        shell: bash
        run: |
          out="$("./$BIN" --version)"
          echo "$out"
          case "$out" in *"v$VERSION"*) ;; *) echo "unexpected version output"; exit 1 ;; esac
      - name: Package
        shell: bash
        run: go run ./tools/release package -version "$VERSION" -os "${{ matrix.goos }}" -arch "${{ matrix.goarch }}" -bin "$BIN" -out dist
      - name: Start the packaged Windows executable
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter *.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath "$env:RUNNER_TEMP\pkg check"
          $exe = Get-ChildItem "$env:RUNNER_TEMP\pkg check" -Recurse -Filter tuisense.exe | Select-Object -First 1
          & $exe.FullName --version
          & $exe.FullName doctor --windows
          if ($LASTEXITCODE -ne 0) { throw 'packaged executable failed' }
      # Direct downloads next to the archives: a .deb for Debian/Ubuntu, a .dmg
      # for macOS and the bare .exe for Windows. Each is installed or opened
      # and started below, on the runner that built it.
      - name: Debian package (.deb)
        if: matrix.goos == 'linux'
        run: |
          root="$RUNNER_TEMP/deb"
          debver="$(printf %s "$VERSION" | tr - '~')"   # Debian sorts 0.9.0~rc.1 before 0.9.0
          install -Dm755 "$BIN" "$root/usr/bin/tuisense"
          install -Dm644 contrib/70-tuisense-dualsense.rules "$root/usr/lib/udev/rules.d/70-tuisense-dualsense.rules"
          install -Dm644 LICENSE "$root/usr/share/doc/tuisense/copyright"
          mkdir -p "$root/DEBIAN"
          cat > "$root/DEBIAN/control" <<CONTROL
          Package: tuisense
          Version: $debver
          Architecture: ${{ matrix.goarch }}
          Maintainer: TuiSense <https://github.com/Phobby/TuiSense/issues>
          Installed-Size: $(du -sk "$root/usr" | cut -f1)
          Section: utils
          Priority: optional
          Homepage: https://github.com/Phobby/TuiSense
          Description: Terminal app for game controllers
           Inspect, test and configure game controllers (DualSense, Xbox-class
           and generic gamepads) from the terminal.
          CONTROL
          printf '#!/bin/sh\nset -e\nif command -v udevadm >/dev/null 2>&1; then udevadm control --reload-rules || true; udevadm trigger --subsystem-match=hidraw || true; fi\n' > "$root/DEBIAN/postinst"
          cp "$root/DEBIAN/postinst" "$root/DEBIAN/postrm"
          chmod 755 "$root/DEBIAN/postinst" "$root/DEBIAN/postrm"
          dpkg-deb --root-owner-group --build "$root" "dist/tuisense_${VERSION}_linux_${{ matrix.goarch }}.deb"
      - name: Install, start and remove the .deb
        if: matrix.goos == 'linux'
        run: |
          deb="dist/tuisense_${VERSION}_linux_${{ matrix.goarch }}.deb"
          dpkg-deb --info "$deb"
          sudo apt-get install -y "./$deb"
          test "$(command -v tuisense)" = /usr/bin/tuisense
          tuisense --version | grep -F "v$VERSION"
          tuisense doctor
          test -f /usr/lib/udev/rules.d/70-tuisense-dualsense.rules
          sudo apt-get remove -y tuisense
          test ! -e /usr/bin/tuisense
      - name: macOS disk image (.dmg)
        if: matrix.goos == 'darwin'
        run: |
          stage="$RUNNER_TEMP/dmg/TuiSense"
          mkdir -p "$stage"
          cp "$BIN" "$stage/tuisense"
          cp README.md LICENSE "$stage/"
          hdiutil create -volname "TuiSense $VERSION" -srcfolder "$stage" -format UDZO -ov "dist/tuisense_${VERSION}_darwin_${{ matrix.goarch }}.dmg"
      - name: Open the .dmg and start TuiSense from it
        if: matrix.goos == 'darwin'
        run: |
          mnt="$RUNNER_TEMP/mnt"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "dist/tuisense_${VERSION}_darwin_${{ matrix.goarch }}.dmg"
          "$mnt/tuisense" --version | grep -F "v$VERSION"
          "$mnt/tuisense" doctor
          test -f "$mnt/README.md"
          hdiutil detach "$mnt"
      - name: Windows executable (.exe)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $exe = "dist\tuisense_$($env:VERSION)_windows_${{ matrix.goarch }}.exe"
          Copy-Item $env:BIN $exe
          $v = & $exe --version
          Write-Output $v
          if ($v -notmatch [regex]::Escape("v$($env:VERSION)")) { throw 'the .exe did not start' }
          & $exe doctor --windows
          if ($LASTEXITCODE -ne 0) { throw 'doctor failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Checksums
        run: go run ./tools/release sums -out dist
      - name: Sign checksums
        env:
          SIGNING_KEY: ${{ secrets.TUISENSE_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "TUISENSE_RELEASE_SIGNING_KEY is not configured; refusing to publish an unsigned release." >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/release_key"
          ssh-keygen -Y sign -f "$RUNNER_TEMP/release_key" -n tuisense-release dist/SHA256SUMS
          rm -f "$RUNNER_TEMP/release_key"
      - name: Verify against the pinned key
        run: go run ./tools/release verify -out dist -keys internal/update/trusted_keys.txt
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/tuisense_*"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "TuiSense $GITHUB_REF_NAME" --generate-notes $flags

  # Install the release that was just published, from GitHub, on clean
  # Windows 10/11-class runners (x64 and ARM64).
  windows-install:
    needs: publish
    uses: ./.github/workflows/windows-install.yml
    with:
      version: ${{ needs.publish.outputs.version }}
