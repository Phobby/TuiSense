name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...
      - name: Build
        run: go build -trimpath -o dist/ ./cmd/tuisense

  web-demo:
    name: web demo (website + browser end-to-end)
    # Playwright's Chromium supports Ubuntu 24.04, not yet ubuntu-latest.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/frontend/package-lock.json
      - name: Website tests and type check
        working-directory: website/frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run typecheck
      - name: Browser for the end-to-end test
        working-directory: website/e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: End-to-end (real TuiSense behind tuisense-webd, in Chromium)
        run: make web-e2e

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Support matrix is current
        run: |
          go run ./cmd/tuisense debug support-matrix > /tmp/matrix.md
          diff -u docs/SUPPORT_MATRIX.md /tmp/matrix.md
      - name: Shell installer syntax
        run: sh -n scripts/install.sh
