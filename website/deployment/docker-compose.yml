# TuiSense web demo: hardened two-container deployment.
#
#   cp .env.example .env    # set DEMO_DOMAIN
#   GIT_COMMIT=$(git rev-parse HEAD) docker compose up -d --build
#
# Run from website/deployment/. See docs/WEB_DEMO.md for details.

name: tuisense-web

services:
  backend:
    build:
      context: ../..
      dockerfile: website/deployment/Dockerfile.backend
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: tuisense-web-backend:${GIT_COMMIT:-local}
    restart: unless-stopped
    env_file: .env
    environment:
      TUISENSE_WEB_LISTEN: ":8080"
      TUISENSE_WEB_TRUST_PROXY: "true"
      TUISENSE_WEB_ALLOWED_ORIGINS: https://${DEMO_DOMAIN:?set DEMO_DOMAIN in .env}
    # Never root, no capabilities, no privilege escalation, no devices.
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Session data lives only in memory and disappears with the container.
    tmpfs:
      - /tmp:size=256m,mode=1777,nosuid,nodev,noexec
    # Whole-service ceilings; each session also has its own limits.
    mem_limit: ${BACKEND_MEMORY:-3g}
    cpus: ${BACKEND_CPUS:-4}
    pids_limit: 1024
    ulimits:
      nofile: 8192
    # Optional stronger isolation where gVisor is installed:
    # runtime: runsc
    networks: [internal]
    healthcheck:
      test: ["CMD", "/usr/local/bin/tuisense-webd", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ../..
      dockerfile: website/deployment/Dockerfile.frontend
    image: tuisense-web-frontend:${GIT_COMMIT:-local}
    restart: unless-stopped
    environment:
      DEMO_DOMAIN: ${DEMO_DOMAIN}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal, edge]

networks:
  # The backend has no route to the internet: sessions cannot reach out.
  internal:
    internal: true
  edge: {}

volumes:
  caddy_data: {}
  caddy_config: {}
